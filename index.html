<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>电路谜题 · 模拟电路游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#12151c;color:#dde3ee;user-select:none;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#1a1f2b;border-bottom:1px solid #2a3245;flex-wrap:wrap}
#top h1{font-size:17px;color:#ffd166;margin-right:6px}
.lvbtn{width:30px;height:30px;border-radius:6px;border:1px solid #3a4560;background:#232a3a;color:#8fa2c8;cursor:pointer;font-size:13px}
.lvbtn:hover{background:#2e3a52}
.lvbtn.cur{background:#ffd166;color:#12151c;border-color:#ffd166;font-weight:bold}
.lvbtn.done{border-color:#4ade80;color:#4ade80}
.lvbtn.lock{opacity:.35;cursor:not-allowed}
#main{display:flex;flex:1;min-height:0}
#side{width:210px;background:#1a1f2b;border-right:1px solid #2a3245;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#side h3{font-size:12px;color:#7c8db0;margin:4px 0 2px}
.pitem{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#232a3a;border:1px solid #3a4560;border-radius:8px;cursor:pointer;font-size:13px}
.pitem:hover{background:#2e3a52}
.pitem.sel{border-color:#ffd166;background:#33301f}
.pitem.out{opacity:.35;cursor:not-allowed}
.pitem canvas{width:34px;height:22px}
.pitem .cnt{margin-left:auto;font-size:11px;color:#7c8db0}
#board{flex:1;position:relative;overflow:hidden}
#cv{display:block;cursor:crosshair;touch-action:none;width:100%;max-width:784px;height:auto;margin:0 auto}
#palette{display:flex;flex-direction:column;gap:6px}
#right{width:250px;background:#1a1f2b;border-left:1px solid #2a3245;padding:12px;overflow-y:auto;font-size:13px;line-height:1.55}
#right h2{font-size:15px;color:#ffd166;margin-bottom:6px}
#desc{color:#aab6d0;margin-bottom:10px}
#goals{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.goal{padding:6px 8px;border-radius:6px;background:#232a3a;border-left:3px solid #556;font-size:12px}
.goal.ok{border-left-color:#4ade80;background:#1c2e24}
.goal.ok::before{content:"✓ ";color:#4ade80}
.goal:not(.ok)::before{content:"○ ";color:#7c8db0}
#hintbox{background:#232a3a;border-radius:8px;padding:8px;font-size:12px;color:#8fa2c8;display:none}
button.act{padding:7px 12px;border-radius:8px;border:1px solid #3a4560;background:#232a3a;color:#dde3ee;cursor:pointer;font-size:13px;margin:2px 4px 2px 0}
button.act:hover{background:#2e3a52}
#tip{position:absolute;pointer-events:none;background:#000c;border:1px solid #3a4560;border-radius:6px;padding:4px 8px;font-size:12px;display:none;z-index:5;white-space:pre}
#win{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10}
#win .card{background:#1a1f2b;border:1px solid #ffd166;border-radius:14px;padding:30px 44px;text-align:center}
#win h2{color:#ffd166;font-size:24px;margin-bottom:8px}
#win p{color:#aab6d0;margin-bottom:16px;font-size:14px}
#win button{padding:10px 22px;border-radius:8px;border:none;background:#ffd166;color:#12151c;font-weight:bold;font-size:15px;cursor:pointer}
#msg{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#7f1d1d;border:1px solid #ef4444;color:#fecaca;padding:6px 14px;border-radius:8px;font-size:13px;display:none;z-index:6}
.note{font-size:11px;color:#5c6b8a;margin-top:auto;padding-top:8px}
#msg{max-width:92%;text-align:center}
#win .card{max-width:86vw}
/* ===== 平板 ===== */
@media (max-width:1180px){
  #side{width:180px}
  #right{width:216px}
  .pitem{font-size:12px}
}
/* ===== 手机 / 竖屏平板 ===== */
@media (max-width:900px){
  body{overflow:auto}
  #app{height:auto;min-height:100dvh}
  #main{flex-direction:column}
  #board{flex:none}
  #side{order:1;width:100%;flex-direction:row;align-items:stretch;overflow-x:auto;overflow-y:hidden;border-right:none;border-top:1px solid #2a3245;padding:8px;-webkit-overflow-scrolling:touch}
  #side h3,.note{display:none}
  #palette{flex-direction:row;gap:6px;flex:0 0 auto}
  .pitem{flex-direction:column;justify-content:center;text-align:center;min-width:68px;max-width:78px;flex:0 0 auto;padding:5px 4px;font-size:11px;gap:3px;line-height:1.25}
  .pitem span{white-space:normal;word-break:break-all}
  .pitem .cnt{margin-left:0}
  #toolDel{flex-direction:column;justify-content:center;min-width:56px;flex:0 0 auto;margin-left:6px;font-size:11px;text-align:center}
  #right{order:2;width:100%;border-left:none;border-top:1px solid #2a3245;padding-bottom:28px}
  #top{padding:6px 8px;gap:5px}
  #top h1{font-size:14px;margin-right:2px}
  #lvname{display:none}
  .lvbtn{width:28px;height:28px;font-size:12px}
  #win .card{padding:22px 26px}
  #win h2{font-size:20px}
  button.act{padding:9px 14px}
}
/* ===== 窄屏手机 ===== */
@media (max-width:420px){
  .lvbtn{width:25px;height:25px;font-size:11px;border-radius:5px}
  #top h1{font-size:13px}
}
</style>
</head>
<body>
<div id="app">
<div id="top">
  <h1>⚡ 电路谜题</h1>
  <div id="lvbtns"></div>
  <span id="lvname" style="font-size:13px;color:#8fa2c8;margin-left:8px"></span>
</div>
<div id="main">
  <div id="side">
    <h3>元件（点选后在板上拖放）</h3>
    <div id="palette"></div>
    <h3>工具</h3>
    <div class="pitem" id="toolDel">🗑 删除元件</div>
    <div class="note">· 拖动两个相邻圆点放置元件<br>· 拖动方向 = 正极→负极<br>· 点击开关/传感器可切换<br>· 右键也可删除<br>· 三极管需拖2格：C→B→E</div>
  </div>
  <div id="board">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div id="msg"></div>
    <div id="win"><div class="card"><h2>🎉 过关！</h2><p id="winp"></p><button id="nextbtn">下一关 →</button></div></div>
  </div>
  <div id="right">
    <h2 id="rtitle"></h2>
    <div id="desc"></div>
    <h3 style="font-size:12px;color:#7c8db0;margin-bottom:5px">目标</h3>
    <div id="goals"></div>
    <button class="act" id="hintbtn">💡 提示</button>
    <button class="act" id="resetbtn">↺ 重置本关</button>
    <div id="hintbox"></div>
    <h3 style="font-size:12px;color:#7c8db0;margin:10px 0 4px">知识点</h3>
    <div id="know" style="font-size:12px;color:#8fa2c8"></div>
  </div>
</div>
</div>
<script>
"use strict";
// ============ 常量与元件定义 ============
const S=68, OX=52, OY=46, COLS=11, ROWS=7; // 网格
const TYPES={
  w:   {n:'导线',        len:1},
  b5:  {n:'电池 5V',     len:1, V:5,  Ri:1},
  b9:  {n:'电池 9V',     len:1, V:9,  Ri:1},
  r330:{n:'电阻 330Ω',   len:1, R:330},
  r1k: {n:'电阻 1kΩ',    len:1, R:1000},
  r10k:{n:'电阻 10kΩ',   len:1, R:10000},
  bulb:{n:'灯泡 (100Ω)', len:1, R:100},
  led: {n:'LED',         len:1, Vf:2.0, Ron:20},
  cap: {n:'电容 2200µF', len:1, C:0.0022},
  sw:  {n:'开关',        len:1},
  d:   {n:'二极管',      len:1, Vf:0.6, Ron:10},
  npn: {n:'NPN 三极管',  len:2},
  ac:  {n:'交流源 ±5V',  len:1, V:5, Ri:1, F:1.2},
  sens:{n:'触摸传感器',  len:1, V:5, Ri:100000},
  probe:{n:'电压表',     len:1, R:1e6},
};
// ============ 全局状态 ============
let comps=[];            // {t,ax,ay,bx,by,fixed,on,burned,i,v,vc,burnT}
let level=0, unlocked=0, tool='w', stock={}, simT=0, phase=0;
let latch={};            // 关卡时序判定用
let winShown=false, editVersion=0;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function px(c){return OX+c*S} function py(r){return OY+r*S}
function dotAt(mx,my){
  const c=Math.round((mx-OX)/S), r=Math.round((my-OY)/S);
  if(c<0||c>=COLS||r<0||r>=ROWS) return null;
  if(Math.hypot(mx-px(c),my-py(r))>S*0.48) return null;
  return [c,r];
}
function edgeKey(ax,ay,bx,by){return ax+','+ay+'|'+bx+','+by}
function compEdges(c){ // 元件占用的单位边列表
  const es=[]; const dx=Math.sign(c.bx-c.ax), dy=Math.sign(c.by-c.ay);
  const n=Math.max(Math.abs(c.bx-c.ax),Math.abs(c.by-c.ay));
  for(let k=0;k<n;k++){
    const x1=c.ax+dx*k,y1=c.ay+dy*k,x2=c.ax+dx*(k+1),y2=c.ay+dy*(k+1);
    es.push(x1<x2||y1<y2?edgeKey(x1,y1,x2,y2):edgeKey(x2,y2,x1,y1));
  }
  return es;
}
function occupied(){const s=new Set();for(const c of comps)for(const e of compEdges(c))s.add(e);return s}
function midOf(c){return [(px(c.ax)+px(c.bx))/2,(py(c.ay)+py(c.by))/2]}
function compAt(mx,my){
  let best=null,bd=26;
  for(const c of comps){const [x,y]=midOf(c);const d=Math.hypot(mx-x,my-y);if(d<bd){bd=d;best=c}}
  return best;
}
function resetLatch(){latch={};winShown=false;editVersion++;}
// ============ 放置与删除 ============
let dragFrom=null, mouseXY=[0,0];
function tryPlace(a,b){
  const T=TYPES[tool]; if(!T) return;
  const dx=b[0]-a[0], dy=b[1]-a[1];
  if(dx!==0&&dy!==0) return showMsg('只能水平或垂直放置');
  const len=Math.abs(dx)+Math.abs(dy);
  if(len===0) return;
  if(tool==='npn'){
    if(len!==2) return showMsg('三极管需要拖 2 格（集电极→基极→发射极）');
  } else if(tool==='w'){
    // 导线允许多格，逐格放
  } else if(len!==1) return showMsg('该元件只占 1 格');
  const occ=occupied();
  const mk=(ax,ay,bx,by,t)=>({t,ax,ay,bx,by,on:false,burned:false,i:0,v:0,vc:0,burnT:0});
  if(tool==='w'){
    const sx=Math.sign(dx),sy=Math.sign(dy);let placed=0;
    for(let k=0;k<len;k++){
      const c=mk(a[0]+sx*k,a[1]+sy*k,a[0]+sx*(k+1),a[1]+sy*(k+1),'w');
      if(!compEdges(c).some(e=>occ.has(e))){comps.push(c);compEdges(c).forEach(e=>occ.add(e));placed++}
    }
    if(placed)resetLatch();
    return;
  }
  if((stock[tool]|0)<=0) return showMsg('该元件已用完');
  const c=mk(a[0],a[1],b[0],b[1],tool);
  if(compEdges(c).some(e=>occ.has(e))) return showMsg('位置已被占用');
  comps.push(c); stock[tool]--; renderPalette(); resetLatch();
}
function removeComp(c){
  if(!c||c.fixed) return;
  comps.splice(comps.indexOf(c),1);
  if(c.t!=='w'&&stock[c.t]!==undefined){stock[c.t]++;renderPalette()}
  resetLatch();
}
let msgTimer=null;
function showMsg(s){
  const m=document.getElementById('msg');m.textContent=s;m.style.display='block';
  clearTimeout(msgTimer);msgTimer=setTimeout(()=>m.style.display='none',2200);
}
// ============ 输入 ============
// 画布可能被 CSS 缩放（手机/平板），坐标需按比例映射回内部像素
function evtXY(e){
  const r=cv.getBoundingClientRect();
  return [(e.clientX-r.left)*(cv.width/r.width),(e.clientY-r.top)*(cv.height/r.height)];
}
function showTip(c,clientX,clientY){
  const tip=document.getElementById('tip');
  const br=document.getElementById('board').getBoundingClientRect();
  tip.style.display='block';
  const nm=c.t==='sens'?(TYPES[c.t].n+(c.on?' (按下)':' (松开)')):TYPES[c.t].n;
  tip.textContent=nm+'\n电压 '+fmtV(c.v)+'  电流 '+fmtI(c.i)+(c.burned?'\n💥 已烧毁':'');
  let tx=clientX-br.left+14, ty=clientY-br.top+8;
  tip.style.left='0px';tip.style.top='0px';
  const tw=tip.offsetWidth,th=tip.offsetHeight;
  if(tx+tw>br.width-4)tx=Math.max(4,clientX-br.left-tw-10);
  if(ty+th>br.height-4)ty=Math.max(4,clientY-br.top-th-10);
  tip.style.left=tx+'px';tip.style.top=ty+'px';
}
function hideTip(){document.getElementById('tip').style.display='none'}
let tipTimer=null;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const [mx,my]=evtXY(e);
  if(e.button===2||tool==='del'){removeComp(compAt(mx,my));return}
  const d=dotAt(mx,my);
  if(d){dragFrom=d;mouseXY=[mx,my];try{cv.setPointerCapture(e.pointerId)}catch(_){ }return}
  const c=compAt(mx,my);
  if(c&&(c.t==='sw'||c.t==='sens')){c.on=!c.on;editVersion++;}
  else if(c&&c.t!=='w'&&e.pointerType!=='mouse'){
    showTip(c,e.clientX,e.clientY);
    clearTimeout(tipTimer);tipTimer=setTimeout(hideTip,1600);
  }
});
cv.addEventListener('pointermove',e=>{
  const [mx,my]=evtXY(e);mouseXY=[mx,my];
  if(e.pointerType!=='mouse'||dragFrom){if(dragFrom)hideTip();return}
  const c=compAt(mx,my);
  if(c&&c.t!=='w')showTip(c,e.clientX,e.clientY);else hideTip();
});
cv.addEventListener('pointerup',e=>{
  if(!dragFrom)return;
  const [mx,my]=evtXY(e);
  const d=dotAt(mx,my);
  if(d&&(d[0]!==dragFrom[0]||d[1]!==dragFrom[1]))tryPlace(dragFrom,d);
  dragFrom=null;
});
cv.addEventListener('pointercancel',()=>{dragFrom=null});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mouseleave',()=>{dragFrom=null;hideTip()});
function fmtV(v){return Math.abs(v)>=1?v.toFixed(2)+'V':(v*1000).toFixed(0)+'mV'}
function fmtI(i){const a=Math.abs(i);return a>=1?i.toFixed(2)+'A':a>=0.001?(i*1000).toFixed(1)+'mA':(i*1e6).toFixed(0)+'µA'}
// ============ 仿真引擎：节点电压法 + 分段线性模型 ============
// 所有电源用诺顿等效（电导+电流源），无需额外支路变量。
const DT=0.004, SUBSTEPS=4, GMIN=1e-9;
function key(x,y){return x+','+y}
function simulate(){
  for(let s=0;s<SUBSTEPS;s++) simStep(DT);
  simT+=DT*SUBSTEPS;
}
function simStep(dt){
  // 1. 并查集：导线合并节点
  const parent={};
  const find=k=>{let r=k;while(parent[r]!==undefined&&parent[r]!==r)r=parent[r];parent[k]=r;return r};
  const uni=(a,b)=>{const ra=find(a),rb=find(b);if(ra!==rb)parent[ra]=rb};
  const touch=k=>{if(parent[k]===undefined)parent[k]=k};
  const terms=c=>{ // 元件端子列表 [[x,y],...]，npn: [C,B,E]
    if(c.t==='npn'){const mx=(c.ax+c.bx)/2,my=(c.ay+c.by)/2;return [[c.ax,c.ay],[mx,my],[c.bx,c.by]]}
    return [[c.ax,c.ay],[c.bx,c.by]];
  };
  for(const c of comps){
    for(const t of terms(c)) touch(key(t[0],t[1]));
    if(c.t==='w') uni(key(c.ax,c.ay),key(c.bx,c.by));
  }
  // 2. 选地：第一个电源的负端
  let gnd=null;
  for(const c of comps){if(c.t==='b5'||c.t==='b9'||c.t==='ac'||c.t==='sens'){gnd=find(key(c.bx,c.by));break}}
  if(gnd===null){for(const c of comps){c.i=0;c.v=0}return}
  // 3. 节点编号（地=-1）
  const idx={}; let N=0;
  for(const k in parent){const r=find(k);if(idx[r]===undefined)idx[r]=(r===gnd?-1:N++)}
  const ni=(x,y)=>idx[find(key(x,y))];
  if(N===0){for(const c of comps){c.i=0;c.v=0}return}
  // 4. PWL 状态迭代
  const els=comps.filter(c=>c.t!=='w');
  for(const c of els){if(c._st===undefined)c._st=false;if(c._stB===undefined)c._stB=false}
  let volt=null;
  for(let iter=0;iter<25;iter++){
    const A=Array.from({length:N},()=>new Float64Array(N)), Z=new Float64Array(N);
    const stampG=(a,b,g)=>{
      if(a>=0)A[a][a]+=g; if(b>=0)A[b][b]+=g;
      if(a>=0&&b>=0){A[a][b]-=g;A[b][a]-=g}
    };
    const stampI=(a,b,J)=>{if(a>=0)Z[a]+=J;if(b>=0)Z[b]-=J}; // J 从 b 流向 a（注入a）
    for(let n=0;n<N;n++)A[n][n]+=GMIN;
    for(const c of els){
      const T=TYPES[c.t];
      const a=ni(c.ax,c.ay), b=ni(c.bx,c.by);
      switch(c.t){
        case 'r330':case 'r1k':case 'r10k':case 'bulb':case 'probe':
          stampG(a,b,1/T.R);break;
        case 'b5':case 'b9':{const g=1/T.Ri;stampG(a,b,g);stampI(a,b,T.V*g);break}
        case 'ac':{const g=1/T.Ri;const v=T.V*Math.sin(2*Math.PI*T.F*simT);stampG(a,b,g);stampI(a,b,v*g);break}
        case 'sens':{const g=1/T.Ri;stampG(a,b,g);if(c.on)stampI(a,b,T.V*g);break}
        case 'sw':stampG(a,b,c.on?20:GMIN);break;
        case 'cap':{const g=T.C/dt;stampG(a,b,g);stampI(a,b,g*c.vc);break}
        case 'led':case 'd':{
          if(c.burned){stampG(a,b,GMIN);break}
          if(c._st){const g=1/T.Ron;stampG(a,b,g);stampI(a,b,T.Vf*g)}
          else stampG(a,b,GMIN);
          break;
        }
        case 'npn':{
          const m=ni((c.ax+c.bx)/2,(c.ay+c.by)/2);
          // B-E 结（m→b）
          if(c._stB){const g=1/200;stampG(m,b,g);stampI(m,b,0.65*g)}
          else stampG(m,b,GMIN);
          // C-E 沟道（a→b）
          stampG(a,b,c._st?1/20:GMIN);
          break;
        }
      }
    }
    volt=gauss(A,Z,N);
    // 更新 PWL 状态
    const V=n=>n<0?0:volt[n];
    let changed=false;
    for(const c of els){
      const T=TYPES[c.t];
      const a=ni(c.ax,c.ay), b=ni(c.bx,c.by);
      if(c.t==='led'||c.t==='d'){
        if(c.burned)continue;
        const vd=V(a)-V(b);
        let want=c._st?((vd-T.Vf)/T.Ron>0):(vd>T.Vf);
        if(iter>15)want=c._st;
        if(want!==c._st){c._st=want;changed=true}
      } else if(c.t==='npn'){
        const m=ni((c.ax+c.bx)/2,(c.ay+c.by)/2);
        const vbe=V(m)-V(b);
        let wantB=c._stB?((vbe-0.65)/200>0):(vbe>0.65);
        const ib=wantB?Math.max(0,(vbe-0.65)/200):0;
        let want=ib>3e-5; // 基极电流阈值 30µA
        if(iter>15){wantB=c._stB;want=c._st}
        if(wantB!==c._stB||want!==c._st){c._stB=wantB;c._st=want;changed=true}
      }
    }
    if(!changed)break;
  }
  // 5. 结果回写
  const V=n=>n<0?0:volt[n];
  for(const c of comps){
    const T=TYPES[c.t];
    const a=ni(c.ax,c.ay), b=ni(c.bx,c.by);
    const vd=V(a)-V(b);
    c.v=vd;
    switch(c.t){
      case 'w':c.i=0;break; // 导线电流不单独计算
      case 'r330':case 'r1k':case 'r10k':case 'bulb':case 'probe':c.i=vd/T.R;break;
      case 'b5':case 'b9':c.i=(T.V-vd)/T.Ri;break;
      case 'ac':{const v=T.V*Math.sin(2*Math.PI*T.F*simT);c.i=(v-vd)/T.Ri;break}

      case 'sw':c.i=vd*(c.on?20:GMIN);break;
      case 'cap':c.i=T.C/dt*(vd-c.vc);c.vc=vd;break;
      case 'led':case 'd':c.i=(c.burned||!c._st)?0:Math.max(0,(vd-T.Vf)/T.Ron);break;

    if((c.t==='led')&&!c.burned){

      c.burnT=over?c.burnT+dt:0;
      if(vd<-4.5)c.burnT+=dt*4;

function gauss(A,Z,n){
  const x=new Float64Array(n);
  for(let col=0;col<n;col++){
    let p=col;
    for(let r=col+1;r<n;r++)if(Math.abs(A[r][col])>Math.abs(A[p][col]))p=r;
    if(Math.abs(A[p][col])<1e-14){A[col][col]=1e-12;continue}
    if(p!==col){const t=A[p];A[p]=A[col];A[col]=t;const z=Z[p];Z[p]=Z[col];Z[col]=z}
    for(let r=col+1;r<n;r++){
      const f=A[r][col]/A[col][col];if(f===0)continue;
      for(let c2=col;c2<n;c2++)A[r][c2]-=f*A[col][c2];
      Z[r]-=f*Z[col];
    }
  }
  for(let r=n-1;r>=0;r--){
    let s=Z[r];
    for(let c2=r+1;c2<n;c2++)s-=A[r][c2]*x[c2];
    x[r]=s/A[r][r];
  }
  return x;
}

function voltColor(v){
  const t=Math.max(-1,Math.min(1,v/9));
  const hue=t>=0?200-t*200:200+(-t)*40;
  return `hsl(${hue},70%,${45+Math.abs(t)*15}%)`;
}
function draw(){
  const W=OX*2+(COLS-1)*S, H=OY*2+(ROWS-1)*S;
  if(cv.width!==W){cv.width=W;cv.height=H}
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#161a24';ctx.fillRect(0,0,W,H);
  // 网格点
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
    ctx.fillStyle='#2e3850';ctx.beginPath();ctx.arc(px(c),py(r),3,0,7);ctx.fill();
  }
  // 元件
  for(const c of comps) drawComp(c);
  // 节点电压着色（有元件连接的点）
  const seen=new Set();
  for(const c of comps){
    const pts=c.t==='npn'?[[c.ax,c.ay],[(c.ax+c.bx)/2,(c.ay+c.by)/2],[c.bx,c.by]]:[[c.ax,c.ay],[c.bx,c.by]];
    for(const p of pts){
      const k=p[0]+','+p[1];if(seen.has(k))continue;seen.add(k);
      ctx.fillStyle='#dde3ee';ctx.beginPath();ctx.arc(px(p[0]),py(p[1]),4,0,7);ctx.fill();
    }
  }
  // 拖放预览
  if(dragFrom){
    ctx.strokeStyle='#ffd16688';ctx.lineWidth=3;ctx.setLineDash([6,5]);
    ctx.beginPath();ctx.moveTo(px(dragFrom[0]),py(dragFrom[1]));ctx.lineTo(mouseXY[0],mouseXY[1]);ctx.stroke();
    ctx.setLineDash([]);
  }
}
function drawComp(c){
  const T=TYPES[c.t];
  const x1=px(c.ax),y1=py(c.ay),x2=px(c.bx),y2=py(c.by);
  const mx=(x1+x2)/2,my=(y1+y2)/2;

  switch(c.t){
    case 'b5':case 'b9':{
      ctx.strokeStyle='#ffd166';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(-6,-14);ctx.lineTo(-6,14);ctx.stroke(); // 长线=正极(a)
      ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(5,-7);ctx.lineTo(5,7);ctx.stroke();
      ctx.strokeStyle=wire;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(-gap,0);ctx.lineTo(-6,0);ctx.moveTo(5,0);ctx.lineTo(gap,0);ctx.stroke();
      ctx.save();ctx.rotate(-ang);ctx.fillStyle='#ffd166';ctx.fillText('+',(ang===0?-14:14),(ang===0?-18:-14));ctx.restore();
      label(T.n,'#ffd166');break;
    }
    case 'sens':{
      ctx.fillStyle=c.on?'#4ade80':'#33415e';
      ctx.beginPath();ctx.roundRect(-20,-13,40,26,6);ctx.fill();
      ctx.save();ctx.rotate(-ang);ctx.fillStyle=c.on?'#12351f':'#aab6d0';ctx.fillText(c.on?'ON':'触摸',0,4);ctx.restore();
      label('传感器(点击)','#4ade80');break;
    }
    case 'ac':{
      ctx.strokeStyle='#c084fc';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-8,0);ctx.quadraticCurveTo(-4,-8,0,0);ctx.quadraticCurveTo(4,8,8,0);ctx.stroke();
      ctx.strokeStyle=wire;ctx.beginPath();ctx.moveTo(-gap,0);ctx.lineTo(-14,0);ctx.moveTo(14,0);ctx.lineTo(gap,0);ctx.stroke();
      label('AC','#c084fc');break;
    }
    case 'r330':case 'r1k':case 'r10k':{
      ctx.strokeStyle='#8fd3f4';ctx.lineWidth=2.5;
      ctx.strokeRect(-16,-7,32,14);
      ctx.strokeStyle=wire;ctx.beginPath();ctx.moveTo(-gap,0);ctx.lineTo(-16,0);ctx.moveTo(16,0);ctx.lineTo(gap,0);ctx.stroke();
      label(T.n.split(' ')[1],'#8fd3f4');break;
    }
    case 'probe':{
      ctx.strokeStyle='#4ade80';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.stroke();
      ctx.save();ctx.rotate(-ang);ctx.fillStyle='#4ade80';ctx.fillText('V',0,4);
      ctx.fillText(fmtV(c.v),0,ang===0?-24:-24);ctx.restore();
      ctx.strokeStyle=wire;ctx.beginPath();ctx.moveTo(-gap,0);ctx.lineTo(-14,0);ctx.moveTo(14,0);ctx.lineTo(gap,0);ctx.stroke();

    }
    case 'bulb':{

      ctx.fillStyle=g>0.2?`rgba(255,225,150,${0.3+g*0.7})`:'#232a3a';
      ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();
      ctx.strokeStyle='#dde3ee';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-9,-9);ctx.lineTo(9,9);ctx.moveTo(9,-9);ctx.lineTo(-9,9);ctx.stroke();

      ctx.fillStyle=c.burned?'#444':(g>0.15?`rgb(255,${120-g*60},80)`:'#5b2333');

      ctx.beginPath();ctx.moveTo(8,-9);ctx.lineTo(8,9);ctx.stroke();
      ctx.strokeStyle=wire;ctx.beginPath();ctx.moveTo(-gap,0);ctx.lineTo(-8,0);ctx.moveTo(8,0);ctx.lineTo(gap,0);ctx.stroke();
      if(c.burned){ctx.save();ctx.rotate(-ang);ctx.fillStyle='#ef4444';ctx.font='14px sans-serif';ctx.fillText('💥',0,-16);ctx.restore()}

    case 'd':{

      label('二极管');break;
    }
    case 'cap':{
      ctx.strokeStyle='#8fd3f4';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(-4,-12);ctx.lineTo(-4,12);ctx.moveTo(4,-12);ctx.lineTo(4,12);ctx.stroke();
      ctx.strokeStyle=wire;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-gap,0);ctx.lineTo(-4,0);ctx.moveTo(4,0);ctx.lineTo(gap,0);ctx.stroke();
      label(fmtV(c.v),'#8fd3f4');break;
    }
    case 'sw':{

      ctx.beginPath();ctx.arc(-12,0,3.5,0,7);ctx.fill();ctx.beginPath();ctx.arc(12,0,3.5,0,7);ctx.fill();
      ctx.strokeStyle='#ffd166';ctx.lineWidth=3;

    case 'npn':{

      ctx.beginPath();ctx.arc(0,0,20,0,7);ctx.stroke();
      // 基极竖线 + C/E 斜线；基极在中点（画在圆上方連到中点网格点）
      ctx.beginPath();ctx.moveTo(-8,-10);ctx.lineTo(-8,10);ctx.stroke();

// ============ 关卡管理 & UI ============
function loadLevel(i){
  level=i; const L=LEVELS[i];
  comps=L.pre.map(p=>({...p}));
  stock={...L.palette}; simT=0; tool='w'; resetLatch();
  document.getElementById('lvname').textContent=L.name;
  document.getElementById('rtitle').textContent=L.name;
  document.getElementById('desc').textContent=L.desc;
  document.getElementById('know').textContent=L.know;
  const hb=document.getElementById('hintbox');hb.style.display='none';hb.textContent=L.hint;
  document.getElementById('win').style.display='none';
  renderPalette(); renderLvBtns(); renderGoals();
}
function renderLvBtns(){
  const d=document.getElementById('lvbtns');d.innerHTML='';
  LEVELS.forEach((L,i)=>{
    const b=document.createElement('button');
    b.className='lvbtn'+(i===level?' cur':'')+(i<unlocked?' done':'')+(i>unlocked?' lock':'');
    b.textContent=L.sandbox?'★':(i+1);
    if(i<=unlocked)b.onclick=()=>loadLevel(i);
    d.appendChild(b);
  });
}
function renderPalette(){
  const d=document.getElementById('palette');d.innerHTML='';
  const L=LEVELS[level];
  const items=['w',...Object.keys(L.palette)];
  for(const t of items){
    const div=document.createElement('div');
    const n=t==='w'?Infinity:(stock[t]|0);
    div.className='pitem'+(tool===t?' sel':'')+(n<=0?' out':'');
    const ic=document.createElement('canvas');drawIcon(ic,t);div.appendChild(ic);
    const sp=document.createElement('span');sp.textContent=TYPES[t].n;div.appendChild(sp);
    const ct=document.createElement('span');ct.className='cnt';ct.textContent=t==='w'?'∞':('×'+n);div.appendChild(ct);
    if(n>0)div.onclick=()=>{tool=t;renderPalette();updDelBtn()};
    d.appendChild(div);
  }
  updDelBtn();
}
function updDelBtn(){document.getElementById('toolDel').className='pitem'+(tool==='del'?' sel':'')}
document.getElementById('toolDel').onclick=()=>{tool='del';renderPalette()};
document.getElementById('hintbtn').onclick=()=>{
  const hb=document.getElementById('hintbox');hb.style.display=hb.style.display==='none'?'block':'none';
};
document.getElementById('resetbtn').onclick=()=>loadLevel(level);
document.getElementById('nextbtn').onclick=()=>{
  if(level+1<LEVELS.length)loadLevel(level+1);
  else document.getElementById('win').style.display='none';
};
// 目标判定
let goalStates=[], winT=0;
function renderGoals(){
  const d=document.getElementById('goals');d.innerHTML='';
  LEVELS[level].goals.forEach((g,i)=>{
    const div=document.createElement('div');
    div.className='goal'+(goalStates[i]?' ok':'');
    div.textContent=g.text;d.appendChild(div);
  });
}
function checkGoals(dt){
  const L=LEVELS[level];
  const prev=goalStates.join(',');
  goalStates=L.goals.map(g=>{try{return !!g.check(dt)}catch(e){return false}});
  if(goalStates.join(',')!==prev)renderGoals();
  if(L.sandbox)return;
  if(goalStates.every(x=>x)){
    winT+=dt;
    if(winT>0.4&&!winShown){
      winShown=true;
      if(level>=unlocked)unlocked=level+1;
      document.getElementById('winp').textContent='「'+L.name.replace(/^\d+\.\s*/,'')+'」完成！'+(level+2<=LEVELS.length?'':'');
      document.getElementById('nextbtn').textContent=level+1<LEVELS.length?(LEVELS[level+1].sandbox?'进入自由实验室 ★':'下一关 →'):'完成';
      document.getElementById('win').style.display='flex';
      renderLvBtns();
    }
  } else winT=0;
}
// ============ 主循环 ============
let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  phase=(phase+dt*0.35)%1;
  try{simulate()}catch(e){}
  checkGoals(dt);
  draw();
  requestAnimationFrame(loop);
}
loadLevel(0);
requestAnimationFrame(loop);
</script>
